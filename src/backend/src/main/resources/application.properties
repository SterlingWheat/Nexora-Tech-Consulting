# Carga nativa del archivo .env (busca en la carpeta actual, en src y en la raíz del proyecto)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.application.name=backend
server.port=8080

# Base de datos (extraída del .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver y JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad y JWT (extraído del .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:${app.frontend-origin}}
app.password-reset.fingerprint-secret=${PASSWORD_RESET_FINGERPRINT_SECRET:${app.jwt.secret}}
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT30M}
app.password-reset.request-cooldown=${PASSWORD_RESET_REQUEST_COOLDOWN:PT1M}

# SMTP (extraído del .env)
app.smtp.host=${SMTP_HOST:smtp-relay.brevo.com}
app.smtp.port=${SMTP_PORT:587}
app.smtp.secure=${SMTP_SECURE:false}
app.smtp.username=${SMTP_USER}
app.smtp.password=${SMTP_PASS}
app.smtp.from=${SMTP_FROM}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
springdoc.swagger-ui.url=/openapi.yaml