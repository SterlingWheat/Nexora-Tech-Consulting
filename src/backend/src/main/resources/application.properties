app.password-reset.fingerprint-secret=${PASSWORD_RESET_FINGERPRINT_SECRET:${app.jwt.secret}}
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT30M}
app.password-reset.request-cooldown=${PASSWORD_RESET_REQUEST_COOLDOWN:PT1M}

# SMTP para envío de correo
app.smtp.host=${SMTP_HOST:}
app.smtp.port=${SMTP_PORT:465}
app.smtp.secure=${SMTP_SECURE:true}
app.smtp.username=${SMTP_USER:}
app.smtp.password=${SMTP_PASS:}
app.smtp.from=${SMTP_FROM:}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
springdoc.swagger-ui.url=/openapi.yaml