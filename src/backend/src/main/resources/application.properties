spring.application.name=backend
server.port=8080

# Credenciales de Neon con fallback para desarrollo local
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-divine-lab-b6h1igzf-pooler.c-2.sa-east-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_vifIGjAQ3Ze9&sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_vifIGjAQ3Ze9}

# Driver y JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT con fallback de desarrollo
app.jwt.secret=${JWT_SECRET:123456789011121314151617181920123456789012345}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
